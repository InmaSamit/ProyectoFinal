<h2>Mis intereses</h2>

<table class="table table-striped">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Descripción</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let interest of interests">
      <td>{{ interest.title }}</td>
      <td>{{ interest.description }}</td>
      <td>
        <button class="btn btn-outline-primary btn-sm me-2" (click)="goToDetail(interest.id)">
          👁️
        </button>
        <button class="btn btn-outline-danger btn-sm" (click)="deleteInterest(interest.id)">
          🗑️
        </button>
      </td>
    </tr>
  </tbody>
</table>
