<div class="modal-backdrop">
    <div class="modal-form">
      <h3 class="text-center mb-4">Registrar usuario</h3>
      <form (ngSubmit)="register()" #registerForm="ngForm" class="form-grid">
        
        <div class="form-row">
          <label for="name">Nombre</label>
          <input id="name" type="text" class="form-control" [(ngModel)]="user.name" name="name" required>
        </div>
  
        <div class="form-row">
          <label for="email">Email</label>
          <input id="email" type="email" class="form-control" [(ngModel)]="user.email" name="email" required>
        </div>
  
        <div class="form-row">
          <label for="phone">Teléfono</label>
          <input id="phone" type="text" class="form-control" [(ngModel)]="user.phone" name="phone">
        </div>
  
        <div class="form-row">
          <label for="password">Contraseña</label>
          <input id="password" type="password" class="form-control" [(ngModel)]="user.password" name="password" required>
        </div>
  
        <div class="d-flex justify-content-end gap-2 mt-4">
          <button type="button" class="btn btn-secondary" (click)="cancel()">Cancelar</button>
          <button type="submit" class="btn btn-primary" [disabled]="registerForm.invalid">Registrar</button>
        </div>
  
      </form>
    </div>
  </div>
